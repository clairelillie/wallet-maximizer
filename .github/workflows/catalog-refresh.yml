name: Refresh card catalog

on:
  schedule:
    # 21:00 and 22:00 UTC on Monday. One of those is 5:00pm in New York,
    # depending on daylight saving time. The gate keeps the other one.
    - cron: "0 21 * * 1"
    - cron: "0 22 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - id: window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=America/New_York date +%H)
          if [ "$hour" = "17" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Draft catalog review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CATALOG_REFRESH_MODEL: ${{ vars.CATALOG_REFRESH_MODEL }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not set. Checking that issuer pages still return benefit text."
            npx tsx scripts/refresh-catalog.ts --fetch-only
          else
            npx tsx scripts/refresh-catalog.ts
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-review
          path: catalog-reviews/
          if-no-files-found: ignore

      - name: Open a review pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          if (!fs.existsSync("catalog-reviews/latest.json")) process.exit(0);
          const latest = JSON.parse(fs.readFileSync("catalog-reviews/latest.json", "utf8"));
          if (!latest.hasProposals) {
            console.log("No catalog changes to review.");
            process.exit(0);
          }
          fs.writeFileSync("catalog-reviews/.open-pr", latest.directory);
          NODE
          if [ ! -f catalog-reviews/.open-pr ]; then exit 0; fi
          rm -f catalog-reviews/.open-pr
          BRANCH="catalog-refresh-${GITHUB_RUN_ID}"
          git checkout -B "$BRANCH"
          git add -f catalog-reviews
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Review issuer updates to the card catalog"
          git push origin "$BRANCH"
          SUMMARY=$(ls -1 catalog-reviews/*/summary.md | head -n 1)
          gh pr create --title "Review catalog updates" --body "$(head -c 60000 "$SUMMARY")"

      - name: Email the review
        if: always()
        env:
          SMTP_USERNAME: ${{ secrets.CATALOG_REFRESH_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.CATALOG_REFRESH_SMTP_PASSWORD }}
          EMAIL_TO: clairelillie12@gmail.com
        run: |
          python3 <<'PY'
          import json
          import os
          import smtplib
          from email.message import EmailMessage
          from pathlib import Path

          username = os.environ.get("SMTP_USERNAME", "").strip()
          password = os.environ.get("SMTP_PASSWORD", "").strip()
          recipient = os.environ["EMAIL_TO"]
          if not username or not password:
              raise SystemExit(
                  "Add repository secrets CATALOG_REFRESH_SMTP_USERNAME and "
                  "CATALOG_REFRESH_SMTP_PASSWORD. The password is a Gmail app password "
                  "for the sending account, not the normal Gmail password."
              )

          latest_path = Path("catalog-reviews/latest.json")
          if latest_path.exists():
              latest = json.loads(latest_path.read_text())
              summary_path = Path(latest["directory"]) / "summary.md"
              body = summary_path.read_text() if summary_path.exists() else "The catalog refresh finished without a summary."
              subject = "Catalog refresh: proposed changes" if latest.get("hasProposals") else "Catalog refresh: no catalog changes"
          else:
              body = "The catalog refresh failed before it wrote a review."
              subject = "Catalog refresh failed"

          message = EmailMessage()
          message["Subject"] = subject
          message["From"] = username
          message["To"] = recipient
          message.set_content(body)
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(username, password)
              smtp.send_message(message)
          print(f"Emailed {recipient}")
          PY
